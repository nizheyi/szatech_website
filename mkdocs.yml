site_name: SZATech
site_description: Custom precision machining for prototypes, low-volume production and repeat production. SZATech supports research, automation and industrial engineering projects, including complex custom parts.
site_author: SZATech
site_url: https://szatech.com/

use_directory_urls: true

theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.top
    - content.tooltips
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins: []

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

extra:
  generator: false

copyright: Copyright © SZATech
